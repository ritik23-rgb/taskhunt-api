<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskHunt | Club Command Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <div class="ambient-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-glass sticky-top py-3">
        <div class="container-fluid px-3 px-lg-5">
            <a class="navbar-brand d-flex align-items-center gap-2 fs-4" href="#">
                <span class="d-inline-flex align-items-center justify-content-center rounded-3 text-white"
                      style="width:38px; height:38px; background: linear-gradient(135deg, #9333ea, #ec4899);">
                    <i class="bi bi-ticket-perforated-fill fs-5"></i>
                </span>
                <span class="brand-font brand-pill">TaskHunt</span>
                <span class="badge rounded-pill bg-danger bg-opacity-25 text-light fs-6 ms-1">Club Hub</span>
            </a>

            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-sm btn-outline-light rounded-pill px-3" onclick="syncAll(true)">
                    <i class="bi bi-arrow-clockwise me-1"></i>Sync
                </button>
                <div class="d-none d-sm-block text-end lh-sm">
                    <div class="fw-bold small text-white" id="clubName">Campus Club</div>
                    <div class="small" style="color:#f472b6; font-size:0.72rem;" id="clubPosition">Club Authority</div>
                </div>
                <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-3 px-lg-5 py-4">
        <!-- KPIs -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-xl-3"><div class="glass-panel p-3 anim-card"><div class="small text-secondary">Our Events</div><div class="fs-2 fw-bold mono-font" style="color:#e879f9;" id="kpiMyEvents">0</div></div></div>
            <div class="col-6 col-xl-3"><div class="glass-panel p-3 anim-card" style="animation-delay:.05s;"><div class="small text-secondary">Passes Allotted</div><div class="fs-2 fw-bold mono-font text-info" id="kpiTicketsSold">0</div></div></div>
            <div class="col-6 col-xl-3"><div class="glass-panel p-3 anim-card" style="animation-delay:.1s;"><div class="small text-secondary">Pending Proofs</div><div class="fs-2 fw-bold mono-font text-warning" id="kpiPendingProofs">0</div></div></div>
            <div class="col-6 col-xl-3"><div class="glass-panel p-3 anim-card" style="animation-delay:.15s;"><div class="small text-secondary">Club Work Closed</div><div class="fs-2 fw-bold mono-font text-success" id="kpiClosedTasks">0</div></div></div>
        </div>

        <div class="row g-4">
            <!-- Left Dual Creation Studio -->
            <div class="col-lg-4">
                <div class="glass-panel p-4 position-sticky anim-card" style="top:96px; border-color:rgba(236,72,153,0.35);">
                    <div class="d-grid gap-2 mb-3" style="grid-template-columns:1fr 1fr;">
                        <button type="button" class="tab-btn active-pink justify-content-center" id="modeEventBtn" onclick="switchStudio('event')">Host Event</button>
                        <button type="button" class="tab-btn justify-content-center" id="modeWorkBtn" onclick="switchStudio('task')">Give Work</button>
                    </div>

                    <form id="createEventForm">
                        <h5 class="fw-bold mb-2">🎟️ Publish Event Pass</h5>
                        <div class="mb-3"><label class="form-label small">Event Title *</label><input type="text" id="eventTitle" class="form-control dark-input" placeholder="e.g., GLA TechFest Night" required></div>
                        <div class="mb-3"><label class="form-label small">Venue & Details *</label><textarea id="eventDesc" class="form-control dark-input" rows="3" required></textarea></div>
                        <div class="mb-3"><label class="form-label small">Ticket Price (XP) *</label><input type="number" id="eventXp" class="form-control dark-input mono-font fw-bold" min="50" max="5000" value="500" required></div>
                        <button type="submit" class="btn btn-neon-primary w-100">Publish VIP Pass</button>
                    </form>

                    <form id="createTaskForm" class="d-none">
                        <h5 class="fw-bold mb-2">⚡ Assign Club Work</h5>
                        <div class="mb-3"><label class="form-label small">Work Title *</label><input type="text" id="taskTitle" class="form-control dark-input" placeholder="e.g., Design Fest Poster" required></div>
                        <div class="mb-3"><label class="form-label small">Instructions & Proof *</label><textarea id="taskDesc" class="form-control dark-input" rows="3" required></textarea></div>
                        <div class="mb-3"><label class="form-label small">XP Reward *</label><input type="number" id="taskXp" class="form-control dark-input mono-font fw-bold" min="10" max="1000" value="200" required></div>
                        <div class="mb-3">
                            <label class="form-label small text-warning">Deadline *</label>
                            <input type="datetime-local" id="taskDeadline" class="form-control dark-input" required>
                            <div class="d-flex gap-1 mt-2">
                                <button type="button" class="btn btn-sm btn-outline-info rounded-pill" onclick="setClubDeadline(12)">+12h</button>
                                <button type="button" class="btn btn-sm btn-outline-info rounded-pill" onclick="setClubDeadline(24)">+24h</button>
                                <button type="button" class="btn btn-sm btn-outline-info rounded-pill" onclick="setClubDeadline(72)">+3d</button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-neon-emerald w-100">Broadcast Club Work</button>
                    </form>
                </div>
            </div>

            <!-- Right Workspace -->
            <div class="col-lg-8">
                <div class="tab-bar mb-4">
                    <button class="tab-btn active-pink" id="tab-events" onclick="switchWorkspace('events')"><i class="bi bi-ticket-detailed-fill"></i> Events & Attendees</button>
                    <button class="tab-btn" id="tab-tasks" onclick="switchWorkspace('tasks')"><i class="bi bi-clipboard2-check-fill"></i> Club Work & Proofs</button>
                    <button class="tab-btn" id="tab-leaderboard" onclick="switchWorkspace('leaderboard')"><i class="bi bi-trophy-fill"></i> Campus Rank Board</button>
                </div>

                <div id="ws-events"><div class="row g-3" id="eventsContainer"></div></div>
                <div id="ws-tasks" class="d-none"><div class="row g-3" id="clubTasksContainer"></div></div>
                <div id="ws-leaderboard" class="d-none"><div id="clubLeaderboard"></div></div>
            </div>
        </div>
    </div>

    <!-- Attendees Modal (Allotted Ticket IDs + Student Info + CSV Export) -->
    <div class="modal fade modal-glass" id="attendeesModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content p-2">
                <div class="modal-header border-secondary border-opacity-25">
                    <div>
                        <span class="badge bg-warning text-dark rounded-pill px-3 mb-1 fw-bold">ALLOTTED VIP TICKET IDs</span>
                        <h5 class="modal-title fw-bold mb-0" id="attendeesModalTitle">Attendees</h5>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-success rounded-pill px-3" id="exportCsvBtn" onclick="exportAttendeesCsv()">
                            <i class="bi bi-download me-1"></i>Export CSV
                        </button>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                </div>
                <div class="modal-body" id="attendeesListBody"></div>
            </div>
        </div>
    </div>

    <!-- Proof Review Modal -->
    <div class="modal fade modal-glass" id="reviewModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content p-2">
                <div class="modal-header border-secondary border-opacity-25">
                    <div>
                        <span class="badge bg-warning text-dark rounded-pill px-3 mb-1 fw-bold">CLUB FIRST-WIN APPROVAL</span>
                        <h4 class="modal-title fw-bold mb-0" id="revTitle">Work</h4>
                        <small class="text-info" id="revMeta"></small>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="revSubId">
                    <div class="row g-4">
                        <div class="col-lg-7 text-center">
                            <img id="revImg" class="img-fluid rounded-3 border border-secondary" style="max-height:400px;" alt="Proof">
                            <div class="text-start mt-3 p-3 rounded-3 bg-dark bg-opacity-50">
                                <small class="text-info fw-bold d-block">Student Note</small>
                                <span class="small text-light" id="revNote"></span>
                            </div>
                        </div>
                        <div class="col-lg-5 d-flex flex-column">
                            <div class="fs-3 fw-bold mono-font text-warning mb-3" id="revXp">+0 XP</div>
                            <label class="form-label small fw-bold">Quality Rating (1–5 Stars)</label>
                            <div class="d-flex gap-2 mb-3" id="starPicker">
                                <button type="button" class="star-btn lit" data-v="1" onclick="setStars(1)"><i class="bi bi-star-fill"></i></button>
                                <button type="button" class="star-btn lit" data-v="2" onclick="setStars(2)"><i class="bi bi-star-fill"></i></button>
                                <button type="button" class="star-btn lit" data-v="3" onclick="setStars(3)"><i class="bi bi-star-fill"></i></button>
                                <button type="button" class="star-btn lit" data-v="4" onclick="setStars(4)"><i class="bi bi-star-fill"></i></button>
                                <button type="button" class="star-btn lit" data-v="5" onclick="setStars(5)"><i class="bi bi-star-fill"></i></button>
                            </div>
                            <textarea id="revFeedback" class="form-control dark-input mb-4" rows="3" placeholder="Club feedback note..."></textarea>
                            <div class="d-grid gap-2 mt-auto">
                                <button type="button" class="btn btn-neon-emerald py-3" onclick="approveWinner()"><i class="bi bi-trophy-fill me-1"></i>Approve Winner & Award XP</button>
                                <button type="button" class="btn btn-outline-danger rounded-3 py-2" onclick="rejectSubmission()">Reject This Proof</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="alertBox" class="alert d-none"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/club.js"></script>
</body>
</html>
